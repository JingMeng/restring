// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'org.jacoco:org.jacoco.core:0.8.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    compileSdkVersion = 34
    buildToolsVersion = '27.0.3'
    minSdkVersion = 16
    targetSdkVersion = 34

    //Library versions
    supportLibrariesVersion = '27.1.0'

    deps = [
            supportAppCompat: 'androidx.appcompat:appcompat:1.6.1',
            supportDesign   : 'com.google.android.material:material:1.9.0',
            constraintLayout: 'androidx.constraintlayout:constraintlayout:2.1.4',

            junit           : 'junit:junit:4.12',
            hamcrest        : 'org.hamcrest:hamcrest-junit:2.0.0.0',
            mockito         : 'org.mockito:mockito-core:2.+',
            robolectric     : 'org.robolectric:robolectric:3.7.1'
    ]
}
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
